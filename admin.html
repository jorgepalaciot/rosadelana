<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Agregar producto — Rosa de Lana</title>
<style>
  :root{--rosa:#8C3A52;--crema:#F4EBDC;--cafe:#2B1D1B;--suave:#5C4A42;--blanco:#FFFCF7;--tostado:#C98A3F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--crema);color:var(--cafe);font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.5}
  main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  h1{font-family:Georgia,serif;font-weight:600;color:var(--rosa);margin:0 0 4px}
  p.sub{color:var(--suave);margin:0 0 22px}
  form{background:var(--blanco);padding:22px;border-radius:14px;box-shadow:0 10px 30px -12px rgba(43,29,27,.28)}
  label{display:block;font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 6px}
  input,select,textarea{width:100%;padding:11px 13px;border:2px solid rgba(43,29,27,.15);border-radius:10px;font:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rosa)}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.95rem;margin:14px 0 0}
  .check input{width:auto}
  #previas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #previas img{width:72px;height:72px;object-fit:cover;border-radius:8px}
  button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:4px;background:var(--rosa);color:#fff;font:800 .85rem inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  button:disabled{opacity:.5}
  #estado{margin-top:16px;font-weight:700}
  #estado.ok{color:#2e7d32}#estado.error{color:#b3261e}
  details{margin-top:22px;color:var(--suave);font-size:.9rem}
  small{color:var(--suave)}
</style>
</head>
<body>
<main>
  <h1>Agregar producto</h1>
  <p class="sub">Llena los datos y se publica en la web en 1–2 minutos.</p>

  <form id="form">
    <label for="nombre">Nombre</label>
    <input id="nombre" required placeholder="Ej. Cartera Lila con asa larga">

    <div class="fila">
      <div><label for="categoria">Categoría</label>
        <select id="categoria"><option value="carteras">Carteras</option><option value="amigurumis">Amigurumis</option><option value="accesorios">Accesorios</option><option value="otros">Otros</option></select></div>
      <div><label for="precio">Precio (S/)</label>
        <input id="precio" type="number" min="0" step="0.5" required></div>
    </div>

    <label for="medidas">Medidas</label>
    <input id="medidas" placeholder="Ej. 25 x 18 x 8 cm">

    <label for="materiales">Materiales</label>
    <input id="materiales" placeholder="Ej. Lana 100% algodón, forro de tela">

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" rows="3" placeholder="Texto corto sobre la pieza"></textarea>

    <label for="fotos">Fotos (la primera es la principal)</label>
    <input id="fotos" type="file" accept="image/*" multiple required>
    <div id="previas"></div>

    <label class="check"><input type="checkbox" id="destacado"> Destacado</label>
    <label class="check"><input type="checkbox" id="disponible" checked> Disponible</label>

    <button id="enviar" type="submit">Publicar producto</button>
    <div id="estado" role="status"></div>
  </form>

  <details>
    <summary>Conexión con GitHub (una sola vez)</summary>
    <label for="token">Token de GitHub</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <small>Se guarda solo en este navegador. Créalo en GitHub → Settings → Developer settings → Fine-grained tokens, solo para el repo <b>rosadelana</b>, con permiso <b>Contents: Read and write</b>.</small>
  </details>
</main>

<script>
const REPO = "jorgepalaciot/rosadelana", RAMA = "main";
const $ = (id) => document.getElementById(id);
$("token").value = localStorage.getItem("rdl_token") || "";
if (!$("token").value) document.querySelector("details").open = true;

const api = (ruta, op = {}) => fetch(`https://api.github.com/repos/${REPO}/contents/${ruta}`, {
  ...op,
  headers: { Authorization: "Bearer " + $("token").value.trim(), Accept: "application/vnd.github+json", "Content-Type": "application/json" },
});
const slug = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
const enc = (txt) => { let s = ""; new TextEncoder().encode(txt).forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };
const q = (s) => JSON.stringify(s);

async function reducir(archivo) {
  const img = await createImageBitmap(archivo);
  const k = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  return await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result.split(",")[1]); f.readAsDataURL(blob); });
}

$("fotos").addEventListener("change", () => {
  $("previas").innerHTML = "";
  [...$("fotos").files].forEach((f) => { const i = new Image(); i.src = URL.createObjectURL(f); $("previas").appendChild(i); });
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const estado = $("estado"), log = (m, c = "") => { estado.textContent = m; estado.className = c; };
  $("enviar").disabled = true;
  try {
    const tk = $("token").value.trim();
    if (!tk) { document.querySelector("details").open = true; throw new Error("Falta el token de GitHub."); }
    localStorage.setItem("rdl_token", tk);

    log("Leyendo el catálogo…");
    const r = await api("productos.js?ref=" + RAMA);
    if (!r.ok) throw new Error("No pude leer productos.js (" + r.status + "). Revisa el token.");
    const j = await r.json();
    let txt = dec(j.content);

    const nombre = $("nombre").value.trim(), cat = $("categoria").value, base = slug(nombre);
    let id = base, n = 2;
    while (txt.includes(`id: "${id}"`)) id = base + "-" + n++;

    const files = [...$("fotos").files], rutas = [];
    for (let i = 0; i < files.length; i++) {
      log(`Subiendo foto ${i + 1} de ${files.length}…`);
      const ruta = `${cat}/${id}${files.length > 1 ? "-" + (i + 1) : ""}.jpeg`;
      const put = await api("fotos/" + ruta, { method: "PUT", body: JSON.stringify({ message: "Foto: " + id, content: await reducir(files[i]), branch: RAMA }) });
      if (!put.ok) throw new Error("No pude subir la foto (" + put.status + ").");
      rutas.push(ruta);
    }

    let b = `  {\n    id: ${q(id)},\n    nombre: ${q(nombre)},\n    categoria: ${q(cat)},\n    precio: ${Number($("precio").value) || 0},\n    imagen: ${q(rutas[0])},\n`;
    if (rutas.length > 1) b += `    imagenes: ${JSON.stringify(rutas)},\n`;
    b += `    descripcion: ${q($("descripcion").value.trim() || "Tejido a mano. Pieza única.")},\n`;
    if ($("medidas").value.trim()) b += `    medidas: ${q($("medidas").value.trim())},\n`;
    if ($("materiales").value.trim()) b += `    materiales: ${q($("materiales").value.trim())},\n`;
    b += `    destacado: ${$("destacado").checked},\n    disponible: ${$("disponible").checked},\n  },\n`;

    const pos = txt.lastIndexOf("];", txt.indexOf("const TURRONES"));
    if (pos < 0) throw new Error("No encontré dónde insertar el producto en productos.js.");
    txt = txt.slice(0, pos) + b + txt.slice(pos);

    log("Publicando…");
    const fin = await api("productos.js", { method: "PUT", body: JSON.stringify({ message: "Nuevo producto: " + nombre, content: enc(txt), sha: j.sha, branch: RAMA }) });
    if (!fin.ok) throw new Error("No pude guardar productos.js (" + fin.status + "). Si alguien más editó el archivo, vuelve a intentar.");

    log("✓ Listo. En 1–2 minutos aparece en la web.", "ok");
    $("form").reset(); $("previas").innerHTML = ""; $("disponible").checked = true;
  } catch (err) {
    log(err.message, "error");
  }
  $("enviar").disabled = false;
});
</script>
</body>
</html>
